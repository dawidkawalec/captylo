<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Subskrypcja Captylo Pro</title>
<meta name="description" content="Wracasz z zarządzania subskrypcją Captylo Pro.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#10272C">
<link rel="canonical" href="https://captylo.com/pro/konto/">
<link rel="icon" href="../../favicon.ico?v=20260928c" sizes="any">
<link rel="icon" href="../../assets/brand/icon.svg?v=20260928c" type="image/svg+xml">
<link rel="icon" href="../../assets/icon-32.png?v=20260928c" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="../../apple-touch-icon.png?v=20260928c" sizes="180x180">
<link rel="stylesheet" href="../../assets/css/site.css?v=20260930a">
<script src="../../assets/js/grainient.js?v=20260930a" defer></script>
<style>
.done{margin:var(--edge);min-height:calc(100svh - 2 * var(--edge));border-radius:var(--r-tide);display:grid;place-items:center;padding:48px 16px}
.done-card{width:min(520px,100%);text-align:center;padding:clamp(28px,6vw,48px)}
.done-card .icon{width:96px;height:auto;margin:0 auto 26px;filter:drop-shadow(0 18px 28px rgba(4,18,21,.55))}
.done-card h1{font-weight:800;font-size:clamp(30px,5vw,40px);line-height:1.05;letter-spacing:-.035em;color:#fff}
.done-card p{margin-top:16px;font-size:17px;line-height:1.6;color:var(--w2)}
.done-card .en{font-size:15px;color:var(--w3)}
.done-card .btn{margin-top:28px}
.done-card .back{display:inline-block;margin-top:22px;font-size:15px;color:var(--w2);text-decoration:underline;text-underline-offset:3px;text-decoration-color:rgba(255,255,255,.3)}
.done-card .back:hover{color:#fff}
</style>
</head>
<body>
<main class="tide done" data-grainient="dark" data-seed="120">
  <div class="done-card glass">
    <img class="icon" src="../../assets/brand/icon.svg" alt="" width="1024" height="1024">
    <h1>Wracasz z zarządzania subskrypcją.</h1>
    <p>Zmiany widać w aplikacji, w Ustawieniach &gt; Konto Captylo. Otwórz Captylo, żeby odświeżyć plan.</p>
    <a class="btn btn-salt" href="captylo://account/refresh">Otwórz Captylo</a>
    <p class="en" lang="en">You are back from managing your subscription. Open Captylo to refresh your plan.</p>
    <a class="back" href="../../">Wróć na captylo.com</a>
  </div>
</main>
</body>
</html>
