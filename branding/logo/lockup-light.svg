150.31 854.4 150.31Q848.07 150.31 843.39 153.55Q838.7 156.8 836.16 162.77Q833.62 168.75 833.62 177.03Q833.62 185.31 836.16 191.25Q838.7 197.19 843.39 200.39Q848.07 203.59 854.4 203.59Z"/>
</svg>
