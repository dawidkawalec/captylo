<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Captylo - app icon, 32 px master</title>
  <!--
    Hand-hinted master for 32x32 renders only (icon_32x32 and icon_16x16@2x). 1 px = 32 units.
    Same plate as icon.svg; the rim stroke is widened so the plate edge light survives at 32 px.
    The eight 1024 columns cannot survive at 32 px (1.75 px pitch), so the Bar Arc C is rebuilt
    on the pixel grid: five 2 px pills on a 3 px pitch, flat white, no shadows, and the 1 px
    gaps between arm pills are bridged at 50% white. The arms therefore read as one continuous
    arc with waveform notches instead of separate 2 px blocks (no "[:" bracket at 32 px).
      x  8-10  spine          y 10-22
      x 11-13  arm pair       y  8-12 / 20-24
      x 14-16  arm pair       y  7-10 / 22-25   (crest)
      x 17-19  arm pair       y  7-10 / 22-25   (crest)
      x 20-22  terminal pair  y  8-12 / 20-24   (terminals curl in, like the master)
      x 23-25  rec dot 2x2    y 15-17           (in the mouth, on the horizontal axis)
    Mark spans x 8-25, centred on x 16.5 like the master.
  -->
  <defs>
    <path id="squircle" d="M627.36 100c103.83 0 155.75 0 195.41 20.21a185.4 185.4 0 0 1 81.02 81.02c20.21 39.66 20.21 91.58 20.21 195.41L924 627.36c0 103.83 0 155.75 -20.21 195.41a185.4 185.4 0 0 1 -81.02 81.02c-39.66 20.21 -91.58 20.21 -195.41 20.21L396.64 924c-103.83 0 -155.75 0 -195.41 -20.21a185.4 185.4 0 0 1 -81.02 -81.02c-20.21 -39.66 -20.21 -91.58 -20.21 -195.41L100 396.64c0 -103.83 0 -155.75 20.21 -195.41a185.4 185.4 0 0 1 81.02 -81.02c39.66 -20.21 91.58 -20.21 195.41 -20.21Z"/>
    <clipPath id="bodyClip"><use href="#squircle"/></clipPath>
    <!-- Dusk plate: Dusk Navy -> Indigo -> Plate Violet -> Orchid -> Rose -> Peach -->
    <linearGradient id="sky" x1="0" y1="100" x2="0" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#23285A"/>
      <stop offset="0.3" stop-color="#3A3993"/>
      <stop offset="0.56" stop-color="#6560CC"/>
      <stop offset="0.76" stop-color="#A277CC"/>
      <stop offset="0.91" stop-color="#E0849F"/>
      <stop offset="1" stop-color="#F59A64"/>
    </linearGradient>
    <!-- Horizon glow rising from the bottom edge -->
    <radialGradient id="glow" cx="512" cy="1010" r="430" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFB46A" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#F7909A" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#F7909A" stop-opacity="0"/>
    </radialGradient>
    <!-- Lilac halo that fills the C's counter -->
    <radialGradient id="halo" cx="542" cy="512" r="340" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8D86F0" stop-opacity="0.36"/>
      <stop offset="1" stop-color="#8D86F0" stop-opacity="0"/>
    </radialGradient>
    <!-- Inner edge light of the plate (top and horizon) -->
    <linearGradient id="rim" x1="0" y1="100" x2="0" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.38"/>
      <stop offset="0.16" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="0.84" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#FFE6CC" stop-opacity="0.32"/>
    </linearGradient>
    <filter id="bodyShadow" x="-10%" y="-10%" width="120%" height="130%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="dotGlow" x="-150%" y="-150%" width="400%" height="400%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>

  <use href="#squircle" transform="translate(0 10)" fill="#000000" opacity="0.3" filter="url(#bodyShadow)"/>
  <use href="#squircle" fill="url(#sky)"/>
  <g clip-path="url(#bodyClip)">
    <rect x="100" y="100" width="824" height="824" fill="url(#glow)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#halo)"/>
    <use href="#squircle" fill="none" stroke="url(#rim)" stroke-width="64"/>
  </g>

  <!-- Pills: 2 px wide, every edge on a whole pixel -->
  <g fill="#FFFFFF">
    <rect x="256" y="320" width="64" height="384" rx="16"/>
    <rect x="352" y="256" width="64" height="128" rx="16"/>
    <rect x="352" y="640" width="64" height="128" rx="16"/>
    <rect x="448" y="224" width="64" height="96" rx="16"/>
    <rect x="448" y="704" width="64" height="96" rx="16"/>
    <rect x="544" y="224" width="64" height="96" rx="16"/>
    <rect x="544" y="704" width="64" height="96" rx="16"/>
    <rect x="640" y="256" width="64" height="128" rx="16"/>
    <rect x="640" y="640" width="64" height="128" rx="16"/>
  </g>
  <!-- Notches: 1 px bridges at 50% white, so the arms join into one continuous arc -->
  <g fill="#FFFFFF" opacity="0.5">
    <rect x="320" y="320" width="32" height="64"/>
    <rect x="320" y="640" width="32" height="64"/>
    <rect x="416" y="256" width="32" height="64"/>
    <rect x="416" y="704" width="32" height="64"/>
    <rect x="512" y="224" width="32" height="96"/>
    <rect x="512" y="704" width="32" height="96"/>
    <rect x="608" y="256" width="32" height="64"/>
    <rect x="608" y="704" width="32" height="64"/>
  </g>
  <circle cx="768" cy="512" r="57.6" fill="#FF3B30" opacity="0.4" filter="url(#dotGlow)"/>
  <rect x="736" y="480" width="64" height="64" rx="28.8" fill="#FF3B30"/>
</svg>
