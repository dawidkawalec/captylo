<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" width="36" height="36">
  <title>Captylo - menu bar glyph</title>
  <!--
    Template image: pure black on transparent; macOS tints it for light and dark menu bars.
    18 pt canvas (@1x = 18 px, @2x = 36 px, 1 unit = 0.5 pt). Glyph box about 25 x 28 units,
    optically centred (x 6 - 30.8, y 4 - 32).
    Stroke C: centre (20,18), outer r 14, inner r 8 (3 pt stroke); outer left/top/bottom on even units.
    Waveform: 3 bars 2 units wide on even columns (x 13-15, 17-19, 21-23), XOR across the inner
    edge like the app icon, with long drips into the counter so they read at 18 pt.
    No rec dot in the template. While recording, draw a #FF3B30 dot of 5 units over the lower
    terminal (centre x 27.8, y 25.8) instead of shipping a coloured, non-template image.
  -->
  <path fill="#000000" fill-rule="evenodd" d="M29.9 8.1A14 14 0 1 0 29.9 27.9A3 3 0 0 0 25.66 23.66A8 8 0 1 1 25.66 12.34A3 3 0 0 0 29.9 8.1ZM13 11A1 1 0 0 1 15 11L15 15A1 1 0 0 1 13 15ZM17 8A1 1 0 0 1 19 8L19 17A1 1 0 0 1 17 17ZM21 9A1 1 0 0 1 23 9L23 15A1 1 0 0 1 21 15Z"/>
</svg>
