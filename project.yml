name: Captylo
options:
  bundleIdPrefix: com.captylo
  deploymentTarget:
    macOS: "14.4"
  xcodeVersion: "26.0"
  developmentLanguage: pl
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top
  minimumXcodeGenVersion: "2.40.0"

packages:
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio.git
    exactVersion: 0.17.4
  WhisperKit:
    url: https://github.com/argmaxinc/argmax-oss-swift.git
    exactVersion: 1.1.0
  # Software updates (EdDSA-signed appcast on captylo.com). MIT, see NOTICE.md.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.9.4

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    MARKETING_VERSION: "1.0.15"
    CURRENT_PROJECT_VERSION: "1"
    # Sparkle's EdDSA public key (public, fine in the repo). The private half lives only in the
    # owner's login Keychain; REPLACE_ME here would keep the updater off (AppUpdaterConfiguration.isConfigured).
    SPARKLE_PUBLIC_ED_KEY: "+5K36G4/YJ5272hy2BM0Nny8yUITT6ANoJm4uytJyq8="
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_APP_SANDBOX: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    ARCHS: arm64
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
  configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      SWIFT_COMPILATION_MODE: wholemodule

targets:
  Captylo:
    type: application
    platform: macOS
    sources:
      - path: Captylo
        excludes:
          - "**/*.md"
    dependencies:
      - package: FluidAudio
      - package: WhisperKit
        product: WhisperKit
      - package: Sparkle
        product: Sparkle
    entitlements:
      path: Captylo/Captylo.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.device.audio-input: true
        # Hardened Runtime: without it macOS denies EventKit silently, with no prompt.
        com.apple.security.personal-information.calendars: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-only: true
    info:
      path: Captylo/Info.plist
      properties:
        CFBundleName: Captylo
        CFBundleDisplayName: Captylo
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Must stay pl: Polish is the source language and pl.lproj has no Localizable.strings, so
        # with en here a Polish UI reads the English table. A Mac with neither language gets Polish.
        CFBundleDevelopmentRegion: pl
        CFBundleLocalizations: [pl, en]
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSUIElement: false
        NSHumanReadableCopyright: "Copyright 2026 Dawid Kawalec"
        NSMicrophoneUsageDescription: Captylo nagrywa Twój głos, aby zamienić go na tekst.
        NSAudioCaptureUsageDescription: Captylo nagrywa dźwięk spotkania (głosy rozmówców), aby zrobić z niego transkrypt i notatki.
        NSCalendarsFullAccessUsageDescription: Captylo czyta Twój kalendarz, aby nazwać spotkanie, zapisać uczestników i przypomnieć o nagraniu.
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false
        ITSAppUsesNonExemptEncryption: false
        # Bundled Manrope + Inter (Resources/Fonts, SIL OFL), registered at launch.
        ATSApplicationFontsPath: "."
        CFBundleDocumentTypes:
          - CFBundleTypeName: Audio
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.audio, public.movie, org.xiph.ogg-audio, org.xiph.opus]
        CFBundleURLTypes:
          - CFBundleURLName: com.captylo.app
            CFBundleURLSchemes: [captylo]
        # Right click > Usługi > "Popraw w Captylo" (ManualCorrection, CorrectionServiceProvider).
        # NSRequiredContext (even empty) makes the service on by default.
        NSServices:
          - NSMenuItem:
              default: Popraw w Captylo
            NSMessage: fixSelection
            NSPortName: Captylo
            NSSendTypes: [public.utf8-plain-text, NSStringPboardType]
            NSRequiredContext: {}
        # Sparkle: started only by AppState.startServices() and only with a real public key.
        SUFeedURL: https://captylo.com/updates/appcast.xml
        SUPublicEDKey: $(SPARKLE_PUBLIC_ED_KEY)
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
    settings:
      base:
        PRODUCT_NAME: Captylo
        PRODUCT_MODULE_NAME: Captylo
        PRODUCT_BUNDLE_IDENTIFIER: com.captylo.app
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        GENERATE_INFOPLIST_FILE: NO
        COMBINE_HIDPI_IMAGES: YES
    scheme:
      testTargets:
        - CaptyloTests
      gatherCoverageData: false

  CaptyloTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: CaptyloTests
    dependencies:
      - target: Captylo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.captylo.app.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Captylo.app/Contents/MacOS/Captylo"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  Captylo:
    build:
      targets:
        Captylo: all
        CaptyloTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CaptyloTests
    archive:
      config: Release
